---
- name: Download Mise installer
  ansible.builtin.get_url:
    url: https://mise.run
    dest: /tmp/mise-install.sh
    mode: "0755"

- name: Install Mise
  ansible.builtin.command:
    cmd: /tmp/mise-install.sh
    creates: "{{ ansible_facts.user_dir }}/.local/bin/mise"

- name: Install Python, Node.js, and Go through Mise
  ansible.builtin.command:
    cmd: "{{ ansible_facts.user_dir }}/.local/bin/mise use --global {{ item }}"
  environment:
    PATH: "{{ ansible_facts.user_dir }}/.local/bin:{{ ansible_facts.env.PATH }}"
  loop:
    - python@3
    - node@lts
    - go@latest
  register: mise_use_result
  changed_when: mise_use_result.stdout is search('installed|updated|added')
